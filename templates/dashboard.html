<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blood Availability - LifeLink AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="dashboard">

        <h1>🩸 Blood Availability</h1>

        <p>Registered blood donors in our database</p>

        <div class="blood-cards">

            {% for group, count in blood_counts.items() %}

            <div class="blood-card">

                <h2>{{ group }}</h2>

                <p>{{ count }} Donors</p>

            </div>

            {% endfor %}

        </div>

        <a href="/" class="back-button">
            ← Back to Home
        </a>

    </div>

</body>

</html>
